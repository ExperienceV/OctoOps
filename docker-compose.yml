services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: octoops
      POSTGRES_PASSWORD: octoops
      POSTGRES_DB: octoops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octoops -d octoops"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
