services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: octoops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: octoops
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octoops -d octoops"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  server:
    image: ghcr.io/experiencev/octoops:latest
    environment:
      ADDR: "0.0.0.0:8000"
      PGHOST: db
      PGPORT: "5432"
      PGUSER: octoops
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: octoops
      JWT_SECRET: ${JWT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: https://octoops.apeiriumx.com/auth/github/callback
      BASE_URL: https://octoops.apeiriumx.com
      FRONTEND_URL: https://octoops.apeiriumx.com
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./client:/srv/client:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
